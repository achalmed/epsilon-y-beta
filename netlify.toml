# netlify.toml — configuración de Netlify de epsilon-y-beta (epsilon-y-beta.netlify.app/): publica la vitrina empujada, sin build
# Desde la fase 7 de web/docs/plataforma-educativa.md el sitio es la vitrina de la plataforma de cursos (web/_aula):
# `_aula/scripts/publicar.sh epsilon-y-beta --aplicar` la construye, prueba que ninguna URL vieja se pierda y la copia a
# `_vitrina/` (GENERADO; no se edita). `_site/` sigue siendo el render de Quarto, fuente de las lecciones; volver al
# sitio Quarto es `publicar.sh epsilon-y-beta --volver --aplicar` (publish = "_site"). Netlify no ejecuta ningún comando.
[build]
  publish = "_vitrina"
